<!DOCTYPE>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Turnos · Entel Chile Técnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#3777FF;
    --blue-dark:#2456CC;
    --pink:#FF66B3;
    --teal:#00CECB;
    --orange:#F3752B;
    --cream:#F5F6FA;
    --surface:#F5F6FA;
    --ink:#1B2340;
    --ink-soft:#6A6F8C;
    --card:#FFFFFF;
    --border:#E3E6EF;
    --otro:#98A0BE;
    --shadow-sm: 0 1px 2px rgba(27,35,64,.06), 0 1px 1px rgba(27,35,64,.04);
    --shadow-md: 0 6px 18px rgba(27,35,64,.10), 0 2px 6px rgba(27,35,64,.06);
    --shadow-lg: 0 16px 40px rgba(27,35,64,.16), 0 4px 12px rgba(27,35,64,.08);
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 22px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1100px 480px at 8% -8%, rgba(55,119,255,.07), transparent 60%),
      radial-gradient(900px 420px at 100% 0%, rgba(255,102,179,.08), transparent 55%),
      #FFFFFF;
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.brand-title,.jp-name,.section-title{ font-family:'Fredoka',system-ui,sans-serif; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  ::selection{ background:var(--blue); color:#fff; }
  a{ color:inherit; }
  button{ font-family:inherit; }

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:18px;
    padding:14px 26px;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(10px) saturate(140%);
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:12px; margin-right:6px; }
  .brand-mark{
    width:42px; height:42px; border-radius:13px; flex:none;
    background:linear-gradient(135deg,var(--blue),var(--teal));
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow-sm);
    position:relative; overflow:hidden;
  }
  .brand-mark::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(255,255,255,.35), transparent 55%);
  }
  .brand-mark svg{ width:24px; height:24px; position:relative; z-index:1; }
  .brand-title{ font-size:19px; font-weight:600; line-height:1.1; color:var(--ink); }
  .brand-sub{ font-size:12px; color:var(--ink-soft); font-weight:500; }

  .tabs{ display:flex; gap:6px; background:#fff; padding:5px; border-radius:999px; box-shadow:var(--shadow-sm); border:1px solid var(--border); }
  .tab-btn{
    border:none; background:transparent; padding:9px 18px; border-radius:999px;
    font-weight:600; font-size:14px; color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; gap:8px;
    transition:.18s ease;
  }
  .tab-btn .dot{ width:8px; height:8px; border-radius:50%; background:currentColor; opacity:.5; }
  .tab-btn[data-area="tecnico"].active{ background:var(--blue); color:#fff; box-shadow:var(--shadow-sm); }
  .tab-btn[data-area="reclamos"].active{ background:var(--orange); color:#fff; box-shadow:var(--shadow-sm); }
  .tab-btn:not(.active):hover{ color:var(--ink); background:var(--cream); }

  .topbar-spacer{ flex:1; }

  .upload-group{ display:flex; align-items:center; gap:8px; }
  .upload-btn{
    position:relative;
    display:flex; flex-direction:column; align-items:flex-start; gap:1px;
    border:1px solid var(--border); background:#fff; border-radius:14px;
    padding:7px 14px; cursor:pointer; transition:.16s ease;
    font-size:12px; color:var(--ink-soft);
  }
  .upload-btn:hover{ border-color:var(--blue); box-shadow:var(--shadow-sm); transform:translateY(-1px); }
  .upload-btn .ub-label{ font-weight:700; font-size:12.5px; color:var(--ink); display:flex; align-items:center; gap:6px; }
  .upload-btn input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .upload-btn .ub-icon{ font-size:14px; }

  /* ---------- Banner ---------- */
  .banner{
    margin:14px 26px 0; padding:12px 16px; border-radius:14px;
    background:#FFF1E7; border:1px solid #F3C299; color:#9C4813;
    display:flex; align-items:flex-start; gap:10px; font-size:13.5px;
    box-shadow:var(--shadow-sm);
  }
  .banner b{ font-weight:700; }
  .banner .banner-close{ margin-left:auto; background:none; border:none; cursor:pointer; font-size:16px; color:#9C4813; opacity:.6; }
  .banner .banner-close:hover{ opacity:1; }
  .banner-names{ margin-top:6px; font-size:12.5px; color:#B05F1D; line-height:1.6; }
  .banner.banner-danger{ background:#FFECEA; border-color:#F3AFA4; color:#992C1B; }
  .banner.banner-danger .banner-close{ color:#992C1B; }

  /* ---------- Layout ---------- */
  .layout{
    display:grid; grid-template-columns:300px 1fr; gap:20px;
    padding:20px 26px 40px; align-items:start;
  }
  @media (max-width:920px){
    .layout{ grid-template-columns:1fr; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:16px; box-shadow:var(--shadow-sm);
    position:sticky; top:88px;
    max-height:calc(100vh - 108px); display:flex; flex-direction:column;
  }
  @media (max-width:920px){ .sidebar{ position:static; max-height:none; } }
  .sidebar-title{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700; margin:2px 2px 10px; }
  .search-box{ position:relative; margin-bottom:12px; }
  .search-box input{
    width:100%; padding:10px 12px 10px 34px; border-radius:12px; border:1px solid var(--border);
    background:var(--cream); font-size:13.5px; color:var(--ink); outline:none; transition:.15s;
  }
  .search-box input:focus{ border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px rgba(55,119,255,.15); }
  .search-box .sb-icon{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.5; font-size:14px; }

  .jp-list{ overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding-right:2px; }
  .jp-list::-webkit-scrollbar{ width:6px; }
  .jp-list::-webkit-scrollbar-thumb{ background:var(--border); border-radius:6px; }

  .jp-card{
    display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:14px;
    border:1.5px solid transparent; background:var(--cream); cursor:pointer; text-align:left;
    transition:.15s ease; width:100%;
  }
  .jp-card:hover{ transform:translateY(-1px); box-shadow:var(--shadow-sm); }
  .jp-card.active{ background:#EEF3FF; border-color:var(--blue); box-shadow:var(--shadow-sm); }
  .jp-card.is-other{ border-style:dashed; border-color:#D5D9E8; }
  .jp-card.is-other .jp-avatar{ font-size:15px; }
  .jp-card.is-other.active{ border-color:#98A0BE; background:#F1F2F8; }
  .jp-avatar{
    width:38px; height:38px; border-radius:12px; flex:none; color:#fff; font-weight:700; font-size:13.5px;
    display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif;
  }
  .jp-info{ min-width:0; flex:1; }
  .jp-name{ font-size:13.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .jp-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; display:flex; gap:6px; align-items:center; }
  .jp-meta .n-active{ color:var(--blue); font-weight:700; }
  .jp-empty-msg{ font-size:12.5px; color:var(--ink-soft); padding:14px 6px; text-align:center; }

  /* ---------- Main panel ---------- */
  .main-panel{ min-width:0; }
  .panel-header{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:18px 20px; margin-bottom:16px; box-shadow:var(--shadow-sm);
  }
  .ph-top{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .ph-avatar{ width:52px; height:52px; border-radius:16px; color:#fff; font-weight:700; font-size:17px; display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; flex:none; }
  .ph-title{ font-size:20px; font-weight:600; }
  .ph-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .ph-toggle{ margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft); }
  .switch{ position:relative; width:38px; height:22px; background:#D8DBE8; border-radius:999px; cursor:pointer; transition:.16s; flex:none; }
  .switch.on{ background:var(--blue); }
  .switch::after{ content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:var(--shadow-sm); transition:.16s; }
  .switch.on::after{ transform:translateX(16px); }

  .stat-row{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .stat-chip{
    flex:1; min-width:118px; background:var(--cream); border:1px solid var(--border); border-radius:14px;
    padding:10px 13px; display:flex; flex-direction:column; gap:2px;
  }
  .stat-chip .sc-num{ font-family:'Fredoka',sans-serif; font-size:22px; font-weight:600; line-height:1; }
  .stat-chip .sc-label{ font-size:11px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .stat-chip.c-total .sc-num{ color:var(--ink); }
  .stat-chip.c-turno .sc-num{ color:var(--blue); }
  .stat-chip.c-libre .sc-num{ color:#00A6A4; }
  .stat-chip.c-ausente .sc-num{ color:var(--orange); }

  .toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:10px 14px; margin-bottom:14px; box-shadow:var(--shadow-sm);
  }
  .week-nav{ display:flex; align-items:center; gap:8px; }
  .nav-btn{
    width:32px; height:32px; border-radius:10px; border:1px solid var(--border); background:var(--cream);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink);
    transition:.14s;
  }
  .nav-btn:hover{ background:#fff; border-color:var(--blue); color:var(--blue); }
  .nav-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .week-label{ font-size:13.5px; font-weight:600; min-width:168px; text-align:center; }
  .today-btn{
    border:1px solid var(--border); background:#fff; border-radius:10px; padding:6px 12px; font-size:12.5px;
    font-weight:600; color:var(--blue); cursor:pointer;
  }
  .today-btn:hover{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .toolbar-spacer{ flex:1; }
  .view-toggle{ display:flex; background:var(--cream); border:1px solid var(--border); border-radius:10px; padding:3px; }
  .view-toggle button{
    border:none; background:transparent; padding:6px 12px; border-radius:8px; font-size:12.5px; font-weight:600;
    color:var(--ink-soft); cursor:pointer;
  }
  .view-toggle button.active{ background:#fff; color:var(--ink); box-shadow:var(--shadow-sm); }

  /* ---------- Calendar ---------- */
  .cal-wrap{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm); overflow:hidden;
  }
  .cal-scroll{ overflow-x:auto; }
  table.cal{ border-collapse:separate; border-spacing:0; width:100%; min-width:640px; }
  table.cal th, table.cal td{ padding:0; }
  .col-agent{ position:sticky; left:0; z-index:5; background:var(--card); min-width:216px; box-shadow:2px 0 6px rgba(27,35,64,.05); }
  thead .col-agent{ z-index:6; }
  thead th{
    position:sticky; top:0; z-index:3; background:#F7F8FC; padding:10px 8px; text-align:center;
    border-bottom:1px solid var(--border); font-size:11.5px; color:var(--ink-soft); font-weight:700;
  }
  thead th .wd{ text-transform:uppercase; letter-spacing:.04em; font-size:10.5px; }
  thead th .dnum{ font-family:'Fredoka',sans-serif; font-size:15px; color:var(--ink); font-weight:600; margin-top:1px; }
  thead th.today-col{ background:#EAF1FF; }
  thead .col-agent{ text-align:left; padding-left:16px; }

  tbody tr:nth-child(even) .col-agent{ background:#FAFBFD; }
  tbody tr:nth-child(even) td:not(.col-agent){ background:rgba(0,0,0,.012); }
  tbody td{ border-bottom:1px solid #F1EED8; padding:7px; vertical-align:middle; }
  tbody td.today-col{ background:#F5F8FF; }

  .agent-cell{ display:flex; align-items:center; gap:10px; padding:9px 10px 9px 16px; }
  .a-avatar{ width:32px; height:32px; border-radius:10px; flex:none; color:#fff; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; }
  .a-name{ font-size:12.8px; font-weight:600; color:var(--ink); line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; }
  .a-cargo{ font-size:10.5px; color:var(--ink-soft); font-weight:500; }
  .a-inactive .a-name{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:#C6CADA; }
  .badge-estado{ font-size:9px; font-weight:700; padding:1px 6px; border-radius:6px; margin-left:5px; text-transform:uppercase; letter-spacing:.02em; }
  .badge-estado.inactivo{ background:#EEF0F6; color:#5B6178; }

  .day-chip{
    border-radius:11px; padding:6px 4px; text-align:center; min-height:44px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    border-left:4px solid var(--otro); background:#F4F3EA; transition:.14s ease; cursor:default;
  }
  .day-chip:hover{ transform:translateY(-1px) scale(1.02); box-shadow:var(--shadow-sm); }
  .day-chip .dc-time{ font-family:'JetBrains Mono',monospace; font-size:11.3px; font-weight:600; line-height:1.15; }
  .day-chip .dc-label{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; line-height:1.2; }
  .day-chip .dc-icon{ font-size:12px; line-height:1; }

  .chip-turno{ background:#EAF0FF; border-left-color:var(--blue); }
  .chip-turno .dc-time{ color:var(--blue-dark); }
  .chip-libre{ background:#E4FBFA; border-left-color:var(--teal); }
  .chip-libre .dc-label{ color:#008482; }
  .chip-vacaciones{ background:#FFEAF4; border-left-color:var(--pink); }
  .chip-vacaciones .dc-label{ color:#C13B7F; }
  .chip-licencia{ background:#FFEDE0; border-left-color:var(--orange); }
  .chip-licencia .dc-label{ color:#B8500F; }
  .chip-permiso{ background:#F1EAFB; border-left-color:#8B6FD9; }
  .chip-permiso .dc-label{ color:#6B46B8; }
  .chip-otro{ background:#F0F0F6; border-left-color:var(--otro); }
  .chip-otro .dc-label{ color:#6B7190; }
  .chip-vacio{ background:transparent; border-left-color:transparent; }
  .chip-vacio .dc-label{ color:#C6CADA; }

  /* ---------- Legend ---------- */
  .legend{ display:flex; flex-wrap:wrap; gap:14px; padding:13px 18px; border-top:1px solid var(--border); background:#F7F8FC; }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .legend-dot{ width:11px; height:11px; border-radius:4px; }

  .empty-state{ padding:60px 20px; text-align:center; color:var(--ink-soft); }
  .empty-state .es-icon{ font-size:38px; margin-bottom:10px; }
  .empty-state h3{ margin:0 0 6px; color:var(--ink); font-size:17px; }
  .empty-state p{ margin:0; font-size:13.5px; max-width:380px; margin:0 auto; }

  /* ---------- Toast ---------- */
  #toast-host{ position:fixed; bottom:20px; right:20px; z-index:100; display:flex; flex-direction:column; gap:8px; }
  .toast{
    background:var(--ink); color:#fff; padding:12px 16px; border-radius:12px; font-size:13px; font-weight:500;
    box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:9px; min-width:220px;
    animation: toast-in .25s ease;
  }
  .toast.ok{ background:#1E4620; }
  .toast.err{ background:#5C1B1B; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .footer-note{ text-align:center; font-size:11.5px; color:var(--ink-soft); padding:6px 26px 26px; }

  .visually-hidden{ position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  :focus-visible{ outline:2.5px solid var(--blue); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0 1 16 0v5a2 2 0 0 1-2 2h-1v-6h3M4 12v6a1 1 0 0 0 1 1h2v-7H4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <div class="brand-title">Panel de Turnos</div>
      <div class="brand-sub">Entel Chile · Mesa de Trabajo</div>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="Área">
    <button class="tab-btn" data-area="tecnico" role="tab"><span class="dot"></span>Técnico</button>
    <button class="tab-btn" data-area="reclamos" role="tab"><span class="dot"></span>Reclamo</button>
  </div>

  <div class="topbar-spacer"></div>

  <div class="upload-group">
    <label class="upload-btn" title="Sube el Excel de dotación exportado del sistema de RR.HH.">
      <span class="ub-label"><span class="ub-icon">📋</span>Dotación</span>
      <span id="ts-dotacion">—</span>
      <input type="file" id="file-dotacion" accept=".xlsx,.xls">
    </label>
    <label class="upload-btn" title="Sube el Excel 'Calendario de horario de agente' del centro Técnico">
      <span class="ub-label"><span class="ub-icon">🗓️</span>Horario Técnico</span>
      <span id="ts-tecnico">—</span>
      <input type="file" id="file-tecnico" accept=".xlsx,.xls">
    </label>
    <label class="upload-btn" title="Sube el Excel 'Calendario de horario de agente' del centro Reclamo">
      <span class="ub-label"><span class="ub-icon">🗓️</span>Horario Reclamo</span>
      <span id="ts-reclamos">—</span>
      <input type="file" id="file-reclamos" accept=".xlsx,.xls">
    </label>
  </div>
</div>

<div id="banner-host"></div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-title" id="sidebar-title">Jefes de Proyecto · Técnico</div>
    <div class="search-box">
      <span class="sb-icon">🔎</span>
      <input type="text" id="search-input" placeholder="Buscar JP o ejecutivo…">
    </div>
    <div class="jp-list" id="jp-list"></div>
  </aside>

  <main class="main-panel">
    <div id="panel-header-host"></div>
    <div id="toolbar-host"></div>
    <div id="cal-host"></div>
  </main>
</div>

<div class="footer-note">Datos cargados desde NICE WebStation (Bombardero) · Los cambios se guardan automáticamente en este navegador hasta la próxima carga de archivos.</div>

<div id="toast-host"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============================================================

/* ============================================================

   ============================================================ */
const memoryStore = {};
const Storage = {
  async get(key){
    try{
      if(window.storage){
        const r = await window.storage.get(key);
        return r ? r.value : null;
      }
    }catch(e){ /* clave inexistente o sin soporte */ }
    return memoryStore[key] !== undefined ? memoryStore[key] : null;
  },
  async set(key, value){
    memoryStore[key] = value;
    try{
      if(window.storage){ await window.storage.set(key, value); return true; }
    }catch(e){ console.warn('No se pudo persistir', key, e); }
    return false;
  }
};

/* ============================================================
   UTILIDADES
   ============================================================ */
function normName(s, dropEnye){
  if(dropEnye === undefined) dropEnye = true;
  if(s === null || s === undefined) return '';
  s = String(s).trim().toUpperCase();
  if(dropEnye) s = s.replace(/Ñ/g,'');
  s = s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
  s = s.replace(/\s+/g,' ').trim();
  return s;
}
function dateSortKey(d){ const [dd,mm,yy] = d.split('/'); return yy+mm+dd; }
function parseDDMMYY(d){
  const [dd,mm,yy] = d.split('/').map(Number);
  return new Date(2000+yy, mm-1, dd);
}
const WEEKDAYS_ES = ['dom','lun','mar','mié','jue','vie','sáb'];
function weekdayShort(d){ return WEEKDAYS_ES[parseDDMMYY(d).getDay()]; }
function todayStr(){
  const t = new Date();
  const dd = String(t.getDate()).padStart(2,'0');
  const mm = String(t.getMonth()+1).padStart(2,'0');
  const yy = String(t.getFullYear()).slice(-2);
  return `${dd}/${mm}/${yy}`;
}
function initials(name){
  if(!name) return '??';
  const parts = name.replace(',', ' ').trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '??';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
const AVATAR_PALETTE = ['#3777FF','#FF66B3','#00A6A4','#F3752B'];
function colorFor(name){
  let h = 0;
  const s = name || '';
  for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}
function escapeHtml(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, kind){
  const host = document.getElementById('toast-host');
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  const icon = kind === 'ok' ? '✅' : kind === 'err' ? '⚠️' : 'ℹ️';
  el.innerHTML = `<span>${icon}</span><span>${escapeHtml(msg)}</span>`;
  host.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 320); }, 3400);
}
function fmtTimestamp(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-CL', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'});
}

/* ============================================================
   CLASIFICACIÓN DE TURNOS
   ============================================================ */
function classifyShift(raw){
  if(!raw || !String(raw).trim()){
    return {cat:'vacio', label:'Sin dato', icon:'', time:''};
  }
  const v = String(raw).trim().toUpperCase();
  if(v === 'LIBRES' || v === 'FRANCO' || v === 'LIBRE'){
    return {cat:'libre', label:'Libre', icon:'😌', time:''};
  }
  if(v.includes('VACACION')){
    return {cat:'vacaciones', label:'Vacaciones', icon:'🌴', time:''};
  }
  if(v.includes('LICENCIA')){
    return {cat:'licencia', label:'Licencia médica', icon:'🩺', time:''};
  }
  if(v.includes('PERM') || v.includes('AUSENCIA')){
    return {cat:'permiso', label: v.length > 16 ? 'Permiso' : titleCase(v), icon:'📄', time:''};
  }
  const m = v.replace(/\s+/g,'').match(/^(\d{2})(\d{2})-(\d{2})(\d{2})$/);
  if(m){
    const startH = parseInt(m[1],10);
    let icon = '🌅';
    if(startH >= 12 && startH < 18) icon = '☀️';
    else if(startH >= 18 || startH < 5) icon = '🌙';
    return {cat:'turno', label:'Turno', icon, time:`${m[1]}:${m[2]}–${m[3]}:${m[4]}`};
  }
  return {cat:'otro', label: titleCase(v), icon:'•', time:''};
}
function titleCase(s){
  return s.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
}

/* ============================================================
   PARSEO DE DOTACIÓN (xlsx -> roster)
   ============================================================ */
function sheetRows(wb, sheetName){
  const ws = wb.Sheets[sheetName];
  if(!ws) return null;
  return XLSX.utils.sheet_to_json(ws, {header:1, defval:null, blankrows:true, raw:false});
}
function findSheetName(wb, candidates){
  const names = wb.SheetNames;
  for(const cand of candidates){
    const hit = names.find(n => normName(n) === normName(cand));
    if(hit) return hit;
  }
  return null;
}
function parseRosterWorkbook(wb){
  const map = { tecnico:['TECNICO','TÉCNICO'], reclamos:['RECLAMOS','RECLAMO'], roaming:['ROAMING'] };
  const out = {};
  for(const [areaKey, candidates] of Object.entries(map)){
    const sn = findSheetName(wb, candidates);
    if(!sn){ out[areaKey] = []; continue; }
    const rows = sheetRows(wb, sn);
    if(!rows || rows.length < 2){ out[areaKey] = []; continue; }
    const headers = rows[0].map(h => h ? String(h).trim() : '');
    const hidx = {};
    headers.forEach((h,i)=>{ if(h) hidx[h] = i; });
    const g = (row, colName) => {
      const i = hidx[colName];
      if(i === undefined) return null;
      let v = row[i];
      if(v === undefined) v = null;
      if(typeof v === 'string'){
        v = v.trim();
        if(v === '' || v === '\u00a0') v = null;
      }
      return v;
    };
    const agents = [];
    for(let r = 1; r < rows.length; r++){
      const row = rows[r];
      if(!row) continue;
      const dni = g(row, 'DNI');
      if(!dni) continue;
      const nombre = g(row,'Nombre');
      const ap1 = g(row,'Apellido1');
      const ap2 = g(row,'Apellido2');
      const full = `${ap1||''} ${ap2||''}, ${nombre||''}`.trim();
      agents.push({
        dni, nombre, apellido1:ap1, apellido2:ap2,
        nombreCompleto: full,
        nombreKey: normName(full),
        cargo: g(row,'Nombre Cargo'),
        centro: g(row,'Centro'),
        habilidadActual: g(row,'Habilidad Actual'),
        estado: g(row,'ESTADO EJECUTIVO'),
        motivoEstado: g(row,'MOTIVO ESTADO'),
        jefeDirecto: g(row,'Nombre Jefe Directo'),
        contrato: g(row,'CONTRATO'),
        canal: g(row,'CANAL'),
        site: g(row,'SITE'),
        usuario: g(row,'Usuario') || g(row,'USUARIO WDE') || g(row,'USUARIO Genesys'),
      });
    }
    out[areaKey] = agents;
  }
  return out;
}

/* ============================================================
   PARSEO DE HORARIOS (xlsx -> pool de turnos por agente)
   ============================================================ */
function parseScheduleWorkbook(wb){
  const sn = wb.SheetNames.find(n => normName(n).replace(/\s+/g,'').includes('AGENTSCHEDULE')) || wb.SheetNames[0];
  const rows = sheetRows(wb, sn);
  if(!rows) return {};
  const maxRow = rows.length;
  const cell = (r,c) => {
    const row = rows[r-1];
    if(!row) return null;
    const v = row[c-1];
    return v === undefined ? null : v;
  };
  let maxCol = 0;
  rows.forEach(row => { if(row) maxCol = Math.max(maxCol, row.length); });

  // localizar bloques semanales ("Intervalo de fechas: dd/mm/aa - dd/mm/aa" con span <= 7 dias)
  const blocks = [];
  for(let r=1; r<=maxRow; r++){
    const v = cell(r,1);
    if(v && typeof v === 'string' && v.indexOf('Intervalo de fechas:') === 0){
      const m = v.match(/(\d{2}\/\d{2}\/\d{2})\s*-\s*(\d{2}\/\d{2}\/\d{2})/);
      if(m){
        const d1 = parseDDMMYY(m[1]), d2 = parseDDMMYY(m[2]);
        const span = Math.round((d2 - d1) / 86400000);
        if(span >= 0 && span <= 7) blocks.push(r);
      }
    }
  }
  blocks.sort((a,b)=>a-b);

  const pool = {}; // nombreKey -> {id, nombre, shifts}

  blocks.forEach((blockRow, bi) => {
    const nextRow = bi+1 < blocks.length ? blocks[bi+1] : maxRow+1;
    const dateRow = blockRow + 3;
    const anchors = [];
    for(let c=1; c<=maxCol; c++){
      const v = cell(dateRow, c);
      if(v && typeof v === 'string' && /^\d{2}\/\d{2}\/\d{2}$/.test(v.trim())){
        anchors.push([c, v.trim()]);
      }
    }
    anchors.sort((a,b)=>a[0]-b[0]);
    function bucketCol(c){
      let best = null;
      for(const [ac, ad] of anchors){
        if(ac <= c) best = ad; else break;
      }
      return best;
    }

    let r = blockRow;
    while(r < nextRow){
      const idv = cell(r,4);
      const namev = cell(r,5);
      if(idv && /^\d+/.test(String(idv).trim())){
        const aid = String(idv).trim();
        const aname = namev ? String(namev).trim() : '';
        const key = normName(aname);
        if(!pool[key]) pool[key] = {id:aid, nombre:aname, shifts:{}};
        const shiftRow = r+1;
        for(let c=6; c<=maxCol; c++){
          const sv = cell(shiftRow, c);
          if(sv && String(sv).trim()){
            const d = bucketCol(c);
            if(d) pool[key].shifts[d] = String(sv).trim();
          }
        }
      }
      r++;
    }
  });

  return pool;
}

/* Rango de fechas calculado SIEMPRE en vivo a partir del propio horario de cada área.
   Importante: es por área (no global), para que actualizar el horario de un centro
   nunca desalinee ni mezcle las semanas del otro centro. */
function getAreaDateRange(area){
  const all = new Set();
  Object.values(dataset.schedules[area] || {}).forEach(a=>{
    Object.keys(a.shifts).forEach(d=>all.add(d));
  });
  return Array.from(all).sort((a,b)=> dateSortKey(a) < dateSortKey(b) ? -1 : dateSortKey(a) > dateSortKey(b) ? 1 : 0);
}

function wireUpload(inputId, handler){
  const input = document.getElementById(inputId);
  const label = input.closest('.upload-btn');
  input.addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if(!file) return;
    if(label.dataset.busy === '1'){ ev.target.value=''; return; } // evita doble envío
    label.dataset.busy = '1';
    label.style.opacity = '.55';
    label.style.pointerEvents = 'none';
    const labelSpan = label.querySelector('.ub-label');
    const originalHtml = labelSpan.innerHTML;
    labelSpan.innerHTML = '<span class="ub-icon">⏳</span>Procesando…';
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      await handler(wb, file.name);
    }catch(err){
      console.error(err);
      toast('No se pudo procesar el archivo: ' + file.name, 'err');
    }finally{
      ev.target.value = '';
      label.dataset.busy = '0';
      label.style.opacity = '';
      label.style.pointerEvents = '';
      labelSpan.innerHTML = originalHtml;
    }
  });
}

/* --------------------------------------------------------------------
   Resolución de cargo por nombre (para filtrar JPs por "Supervisor").
   "Nombre Jefe Directo" viene como texto libre ("NOMBRE APELLIDOS"),
   en un orden distinto al de las columnas Apellido1/Apellido2/Nombre de
   la dotación, así que comparamos por CONJUNTO de palabras del nombre
   en vez de por la cadena exacta (tolera orden distinto, tildes, Ñ,
   mayúsculas/minúsculas, y nombres de pila incompletos).
   -------------------------------------------------------------------- */
function nameTokens(s){
  if(!s) return [];
  s = String(s).trim().toUpperCase().replace(/Ñ/g,'');
  s = s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
  s = s.replace(/[^A-Z\s]/g,' ');
  return s.split(/\s+/).filter(Boolean);
}
function buildCargoIndex(){
  const list = [];
  ['tecnico','reclamos','roaming'].forEach(area=>{
    getRoster(area).forEach(a=>{
      const tokens = nameTokens(a.nombreCompleto);
      if(tokens.length) list.push({ tokenSet: new Set(tokens), tokenKey: tokens.slice().sort().join(' '), cargo: a.cargo });
    });
  });
  return list;
}
function resolveCargo(jpName, cargoIndex){
  const jTokens = nameTokens(jpName);
  if(jTokens.length === 0) return null;
  const jKey = jTokens.slice().sort().join(' ');
  const exact = cargoIndex.find(p => p.tokenKey === jKey);
  if(exact) return exact.cargo;
  // Coincidencia parcial: todas las palabras del nombre más corto deben
  // estar contenidas en el más largo (p. ej. falta un segundo nombre).
  // Solo se acepta si es única, para no mezclar personas distintas.
  const jSet = new Set(jTokens);
  const candidates = cargoIndex.filter(p=>{
    const small = jSet.size <= p.tokenSet.size ? jSet : p.tokenSet;
    const big = jSet.size <= p.tokenSet.size ? p.tokenSet : jSet;
    if(small.size < 2) return false;
    for(const t of small){ if(!big.has(t)) return false; }
    return true;
  });
  return candidates.length === 1 ? candidates[0].cargo : null;
}
function isSupervisorCargo(cargo){
  return !!cargo && cargo.trim().toLowerCase() === 'supervisor';
}

function getJPGroups(area){
  const agents = getRoster(area);
  const showCesados = ui.showCesados[area];
  const cargoIndex = buildCargoIndex();
  const map = new Map();
  const otros = { name:'Otros ejecutivos', agents:[], isOther:true };
  agents.forEach(a=>{
    const estado = (a.estado || '').trim().toLowerCase();
    if(estado === 'cesado' && !showCesados) return;
    const jp = a.jefeDirecto ? String(a.jefeDirecto).trim() : '';
    if(!jp){ otros.agents.push(a); return; }
    const cargo = resolveCargo(jp, cargoIndex);
    if(!isSupervisorCargo(cargo)){ otros.agents.push(a); return; }
    if(!map.has(jp)) map.set(jp, { name: jp, agents: [] });
    map.get(jp).agents.push(a);
  });
  const groups = Array.from(map.values()).sort((a,b)=> b.agents.length - a.agents.length);
  if(otros.agents.length > 0) groups.push(otros);
  return groups;
}

function findShiftsForAgent(area, agent){
  const primary = dataset.schedules[area] || {};
  const other = dataset.schedules[area === 'tecnico' ? 'reclamos' : 'tecnico'] || {};
  const key = agent.nombreKey;
  if(primary[key]) return primary[key];
  if(other[key]) return other[key];
  return null;
}

/* ¿El horario cargado para esta área realmente contiene datos de este
   equipo? Si nadie cruza, lo más probable es que se haya subido el
   archivo equivocado (p. ej. un export de otro centro). */
function computeAreaCoverage(area){
  const agents = getRoster(area).filter(a => (a.estado||'').trim().toLowerCase() !== 'cesado');
  if(agents.length === 0) return {matched:0, total:0};
  let matched = 0;
  agents.forEach(a=>{
    const sh = findShiftsForAgent(area, a);
    if(sh && Object.keys(sh.shifts||{}).length > 0) matched++;
  });
  return {matched, total: agents.length};
}

function computeUnmatched(){
  const rosterKeys = new Set();
  ['tecnico','reclamos','roaming'].forEach(area=>{
    getRoster(area).forEach(a=> rosterKeys.add(a.nombreKey));
  });
  const missing = new Map();
  ['tecnico','reclamos'].forEach(area=>{
    Object.values(dataset.schedules[area] || {}).forEach(a=>{
      const k = normName(a.nombre);
      if(!rosterKeys.has(k) && !missing.has(k)) missing.set(k, a.nombre);
    });
  });
  return Array.from(missing.values());
}

/* Agrupa las fechas de una área en bloques de 7 días reales (por diferencia de
   calendario, no por posición en el arreglo). Así, si el horario cargado tiene un
   vacío entre dos cargas (por ejemplo, subiste agosto y luego directamente octubre),
   cada semana sigue representando 7 días de calendario reales en vez de mezclar
   fechas lejanas en una misma fila. */
function getWeeks(area){
  const dr = getAreaDateRange(area);
  if(dr.length === 0) return [];
  const start = parseDDMMYY(dr[0]);
  const buckets = new Map();
  dr.forEach(d=>{
    const dt = parseDDMMYY(d);
    const diffDays = Math.round((dt - start) / 86400000);
    const idx = Math.floor(diffDays / 7);
    if(!buckets.has(idx)) buckets.set(idx, []);
    buckets.get(idx).push(d);
  });
  const idxs = Array.from(buckets.keys()).sort((a,b)=>a-b);
  return idxs.map(i=>buckets.get(i));
}

function weekIndexForToday(weeks){
  const t = todayStr();
  for(let i=0;i<weeks.length;i++){
    if(weeks[i].includes(t)) return i;
  }
  return 0;
}

/* ============================================================
   RENDER: TABS
   ============================================================ */
function renderTabs(){
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.area === ui.activeArea);
  });
  document.getElementById('sidebar-title').textContent = `Jefes de Proyecto · ${AREA_LABEL[ui.activeArea]}`;
}

/* ============================================================
   RENDER: BANNER DE DATOS SIN CRUZAR
   ============================================================ */
function renderBanner(){
  const host = document.getElementById('banner-host');
  const blocks = [];

  // Aviso: ejecutivos del archivo de horarios que no existen en la dotación
  if(!ui.dismissedBanners.has('unmatched')){
    const missing = computeUnmatched();
    if(missing.length > 0){
      blocks.push(`
        <div class="banner">
          <span>⚠️</span>
          <div style="flex:1">
            <div><b>${missing.length} ejecutivo${missing.length>1?'s':''}</b> del archivo de horarios no ${missing.length>1?'figuran':'figura'} en la dotación cargada, por lo que no aparece${missing.length>1?'n':''} en ningún equipo. Sube una dotación actualizada para incorporar${missing.length>1?'los':'lo'}.</div>
            <div class="banner-names">${missing.slice(0,25).map(escapeHtml).join(' · ')}${missing.length>25 ? ` … y ${missing.length-25} más` : ''}</div>
          </div>
          <button class="banner-close" data-dismiss="unmatched" aria-label="Cerrar aviso">✕</button>
        </div>`);
    }
  }

  // Aviso: el horario cargado para el área activa no coincide con NADIE del equipo
  // (típicamente indica que se subió el archivo de otro centro por error)
  const covId = 'coverage-' + ui.activeArea;
  if(!ui.dismissedBanners.has(covId)){
    const cov = computeAreaCoverage(ui.activeArea);
    if(cov.total > 0 && cov.matched === 0){
      blocks.push(`
        <div class="banner banner-danger">
          <span>🚫</span>
          <div style="flex:1">
            <div><b>El horario cargado para ${AREA_LABEL[ui.activeArea]} no coincide con ningún ejecutivo de este equipo</b> (0 de ${cov.total}). Es muy probable que el archivo subido en "Horario ${AREA_LABEL[ui.activeArea]}" corresponda a otro centro. Genera de nuevo el reporte en NICE filtrando por el grupo correcto y súbelo aquí.</div>
          </div>
          <button class="banner-close" data-dismiss="${covId}" aria-label="Cerrar aviso">✕</button>
        </div>`);
    }
  }

  host.innerHTML = blocks.join('');
  host.querySelectorAll('.banner-close').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      ui.dismissedBanners.add(btn.dataset.dismiss);
      renderBanner();
    });
  });
}

/* ============================================================
   RENDER: SIDEBAR (LISTA DE JP)
   ============================================================ */
function renderSidebar(){
  const area = ui.activeArea;
  const groups = getJPGroups(area);
  const q = normName(ui.search[area]);
  const host = document.getElementById('jp-list');

  let filtered = groups;
  if(q){
    filtered = groups.filter(g=>{
      if(normName(g.name).includes(q)) return true;
      return g.agents.some(a=> normName(a.nombreCompleto).includes(q));
    });
  }

  if(filtered.length === 0){
    host.innerHTML = `<div class="jp-empty-msg">No se encontraron jefes de proyecto con ese criterio.</div>`;
    return;
  }

  host.innerHTML = filtered.map(g=>{
    const activos = g.agents.filter(a=> (a.estado||'').toLowerCase()==='activo').length;
    const isActive = ui.selectedJP[area] === g.name;
    const color = g.isOther ? '#98A0BE' : colorFor(g.name);
    const avatar = g.isOther ? '👥' : initials(g.name);
    return `
    <button class="jp-card ${isActive?'active':''} ${g.isOther?'is-other':''}" data-jp="${escapeHtml(g.name)}">
      <div class="jp-avatar" style="background:${color}">${avatar}</div>
      <div class="jp-info">
        <div class="jp-name">${escapeHtml(g.name)}</div>
        <div class="jp-meta">${g.isOther ? 'sin supervisor reconocido · ' : ''}<span class="n-active">${activos}</span> activos · ${g.agents.length} en total</div>
      </div>
    </button>`;
  }).join('');

  host.querySelectorAll('.jp-card').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      ui.selectedJP[area] = btn.dataset.jp;
      ui.weekIndex[area] = weekIndexForToday(getWeeks(area));
      renderSidebar();
      renderMain();
    });
  });
}

/* ============================================================
   RENDER: PANEL PRINCIPAL
   ============================================================ */
function renderMain(){
  const area = ui.activeArea;
  const groups = getJPGroups(area);
  const selName = ui.selectedJP[area];
  const group = groups.find(g=> g.name === selName);

  const headerHost = document.getElementById('panel-header-host');
  const toolbarHost = document.getElementById('toolbar-host');
  const calHost = document.getElementById('cal-host');

  if(!group){
    headerHost.innerHTML = '';
    toolbarHost.innerHTML = '';
    calHost.innerHTML = `
      <div class="cal-wrap">
        <div class="empty-state">
          <div class="es-icon">🧭</div>
          <h3>Elige un jefe de proyecto</h3>
          <p>Selecciona un JP en el panel izquierdo para ver el calendario de turnos de su equipo en ${AREA_LABEL[area]}.</p>
        </div>
      </div>`;
    return;
  }

  const showCesados = ui.showCesados[area];
  let members = group.agents.slice().sort((a,b)=> (a.nombreCompleto||'').localeCompare(b.nombreCompleto||'', 'es'));

  // stats de hoy — si la fecha de hoy no está cubierta por el horario cargado de
  // esta área, lo mostramos explícitamente en vez de dejar contadores en 0 que
  // podrían leerse como "nadie está trabajando hoy"
  const t = todayStr();
  const areaRangeForStats = getAreaDateRange(area);
  const todayInRange = areaRangeForStats.includes(t);
  let nTurno=0, nLibre=0, nAusente=0;
  members.forEach(a=>{
    const sh = findShiftsForAgent(area, a);
    const val = sh ? sh.shifts[t] : null;
    const c = classifyShift(val).cat;
    if(c==='turno') nTurno++;
    else if(c==='libre') nLibre++;
    else if(c==='vacaciones'||c==='licencia'||c==='permiso') nAusente++;
  });

  headerHost.innerHTML = `
    <div class="panel-header">
      <div class="ph-top">
        <div class="ph-avatar" style="background:${group.isOther ? '#98A0BE' : colorFor(group.name)}">${group.isOther ? '👥' : initials(group.name)}</div>
        <div>
          <div class="ph-title">${escapeHtml(group.name)}</div>
          <div class="ph-sub">${group.isOther ? 'Ejecutivos cuyo jefe directo no está registrado como Supervisor en la dotación · ' : `Equipo ${AREA_LABEL[area]} · `}${group.agents.length} ejecutivo${group.agents.length===1?'':'s'} asignado${group.agents.length===1?'':'s'}</div>
        </div>
        <div class="ph-toggle">
          Mostrar cesados
          <div class="switch ${showCesados?'on':''}" id="toggle-cesados" role="switch" aria-checked="${showCesados}" tabindex="0"></div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-chip c-total"><div class="sc-num">${group.agents.length}</div><div class="sc-label">Equipo total</div></div>
        <div class="stat-chip c-turno"><div class="sc-num">${todayInRange ? nTurno : '—'}</div><div class="sc-label">En turno hoy</div></div>
        <div class="stat-chip c-libre"><div class="sc-num">${todayInRange ? nLibre : '—'}</div><div class="sc-label">Libres hoy</div></div>
        <div class="stat-chip c-ausente"><div class="sc-num">${todayInRange ? nAusente : '—'}</div><div class="sc-label">Vac. / Licencia / Permiso</div></div>
      </div>
      ${!todayInRange ? `<div style="margin-top:10px; font-size:12px; color:var(--ink-soft); background:var(--cream); border:1px solid var(--border); border-radius:10px; padding:8px 12px;">ℹ️ El horario cargado para ${AREA_LABEL[area]} no incluye la fecha de hoy (${t}). Los contadores de "hoy" se activan de nuevo al cargar un horario más reciente.</div>` : ''}
    </div>`;

  const cesadosSwitch = document.getElementById('toggle-cesados');
  const flipCesados = ()=>{
    ui.showCesados[area] = !ui.showCesados[area];
    renderSidebar();
    renderMain();
  };
  cesadosSwitch.addEventListener('click', flipCesados);
  cesadosSwitch.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); flipCesados(); }
  });

  const weeks = getWeeks(area);
  const wi = Math.min(ui.weekIndex[area] ?? 0, Math.max(0, weeks.length-1));
  ui.weekIndex[area] = wi;
  const viewMode = ui.viewMode[area];
  const week = weeks[wi] || [];
  const rangeLabel = week.length ? `${week[0]} – ${week[week.length-1]}` : '';

  toolbarHost.innerHTML = `
    <div class="toolbar">
      <div class="week-nav">
        <button class="nav-btn" id="wk-prev" ${(wi<=0||viewMode!=='semana')?'disabled':''} aria-label="Semana anterior">‹</button>
        <div class="week-label">${viewMode==='semana' ? rangeLabel : 'Todo el período'}</div>
        <button class="nav-btn" id="wk-next" ${(wi>=weeks.length-1||viewMode!=='semana')?'disabled':''} aria-label="Semana siguiente">›</button>
      </div>
      <button class="today-btn" id="wk-today" ${viewMode!=='semana'?'disabled':''}>Hoy</button>
      <div class="toolbar-spacer"></div>
      <div class="view-toggle">
        <button data-mode="semana" class="${viewMode==='semana'?'active':''}">Semana</button>
        <button data-mode="completo" class="${viewMode==='completo'?'active':''}">Todo el período</button>
      </div>
    </div>`;

  toolbarHost.querySelector('#wk-prev')?.addEventListener('click', ()=>{ ui.weekIndex[area] = Math.max(0, wi-1); renderMain(); });
  toolbarHost.querySelector('#wk-next')?.addEventListener('click', ()=>{ ui.weekIndex[area] = Math.min(weeks.length-1, wi+1); renderMain(); });
  toolbarHost.querySelector('#wk-today')?.addEventListener('click', ()=>{ ui.weekIndex[area] = weekIndexForToday(weeks); renderMain(); });
  toolbarHost.querySelectorAll('.view-toggle button').forEach(b=>{
    b.addEventListener('click', ()=>{ ui.viewMode[area] = b.dataset.mode; renderMain(); });
  });

  const datesToShow = viewMode==='semana' ? week : areaRangeForStats;

  const headerCells = datesToShow.map(d=>{
    const isToday = d === t;
    return `<th class="${isToday?'today-col':''}"><div class="wd">${weekdayShort(d)}</div><div class="dnum">${d.slice(0,5)}</div></th>`;
  }).join('');

  const bodyRows = members.map(a=>{
    const sh = findShiftsForAgent(area, a);
    const estado = (a.estado||'').toLowerCase();
    const isInactive = estado && estado!=='activo';
    const cells = datesToShow.map(d=>{
      const val = sh ? sh.shifts[d] : null;
      const s = classifyShift(val);
      const isToday = d === t;
      return `<td class="${isToday?'today-col':''}">
        <div class="day-chip chip-${s.cat}">
          ${s.time ? `<span class="dc-icon">${s.icon}</span><span class="dc-time">${s.time}</span>` : `<span class="dc-icon">${s.icon}</span><span class="dc-label">${escapeHtml(s.label)}</span>`}
        </div>
      </td>`;
    }).join('');
    return `<tr class="${isInactive?'a-inactive':''}">
      <td class="col-agent">
        <div class="agent-cell">
          <div class="a-avatar" style="background:${colorFor(a.nombreCompleto)}">${initials(a.nombreCompleto)}</div>
          <div>
            <div class="a-name">${escapeHtml(a.nombreCompleto)}${isInactive?`<span class="badge-estado inactivo">${escapeHtml(a.estado)}</span>`:''}</div>
            <div class="a-cargo">${escapeHtml(a.cargo || '')}${!sh ? ' · sin horario cargado' : ''}</div>
          </div>
        </div>
      </td>
      ${cells}
    </tr>`;
  }).join('');

  calHost.innerHTML = `
    <div class="cal-wrap">
      <div class="cal-scroll">
        <table class="cal">
          <thead><tr><th class="col-agent">Ejecutivo</th>${headerCells}</tr></thead>
          <tbody>${bodyRows}</tbody>
        </table>
      </div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--blue)"></span>Turno</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--teal)"></span>Libre</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--pink)"></span>Vacaciones</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--orange)"></span>Licencia médica</div>
        <div class="legend-item"><span class="legend-dot" style="background:#8B6FD9"></span>Permiso / Ausencia</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--otro)"></span>Otro / sin dato</div>
      </div>
    </div>`;
}

/* ============================================================
   RENDER: TIMESTAMPS DE CARGA
   ============================================================ */
function renderTimestamps(){
  document.getElementById('ts-dotacion').textContent = fmtTimestamp(dataset.meta.dotacionUpdated);
  document.getElementById('ts-tecnico').textContent = fmtTimestamp(dataset.meta.tecnicoUpdated);
  document.getElementById('ts-reclamos').textContent = fmtTimestamp(dataset.meta.reclamoUpdated);
}

/* ============================================================
   RENDER TOTAL
   ============================================================ */
function renderAll(){
  renderTabs();
  renderBanner();
  renderSidebar();
  renderMain();
  renderTimestamps();
}

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */
async function init(){
  dataset = await loadDataset();
  if(!dataset.meta) dataset.meta = {};

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      ui.activeArea = btn.dataset.area;
      document.getElementById('search-input').value = ui.search[ui.activeArea] || '';
      renderAll();
    });
  });

  document.getElementById('search-input').addEventListener('input', (e)=>{
    ui.search[ui.activeArea] = e.target.value;
    renderSidebar();
  });

  // seleccion inicial: el usuario mismo si esta presente, si no el primer JP con mas equipo
  ['tecnico','reclamos'].forEach(area=>{
    const groups = getJPGroups(area);
    const preferred = groups.find(g=> normName(g.name).includes('JOSE RICARDO PEREZ RAMONIS'));
    ui.selectedJP[area] = (preferred || groups[0] || {}).name || null;
    ui.weekIndex[area] = weekIndexForToday(getWeeks(area));
  });

  document.querySelector('.tab-btn[data-area="tecnico"]').classList.add('active');
  renderAll();

  // primera vez: persistir el set embebido para que quede disponible localmente
  const existing = await Storage.get('panel_turnos_dataset_v1');
  if(!existing) await saveDataset();
}

init();
</script>
